spring:
  application:
    name: kubeon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kubeon}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

kubeon:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    temperature: 0.1
    timeout-seconds: 30
  reasoning:
    max-tool-calls: ${MAX_TOOL_CALLS:3}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    notify-on-manual: false
  redaction:
    enabled: ${REDACTION_ENABLED:true}
  connectivity-check:
    enabled: ${CONNECTIVITY_CHECK_ENABLED:true}