spring:
  application:
    name: kubeon

  management:
    endpoints:
      web:
        exposure:
          include: health,info

kubeon:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    temperature: 0.1
    timeout-seconds: 30
  reasoning:
    max-tool-calls: ${MAX_TOOL_CALLS:3}